# CI-only ansible.cfg. OVLM writes its own ANSIBLE_CONFIG at run time (contract section 2); this one is
# never read by OVLM. Host-key checking is off ONLY because the target is a throw-away local container.
[defaults]
host_key_checking = False
retry_files_enabled = False
gathering = explicit
fact_caching = memory
display_args_to_stdout = False
no_target_syslog = True
interpreter_python = /usr/bin/python3
[ssh_connection]
pipelining = True
