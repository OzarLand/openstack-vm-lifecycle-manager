---
# OVLM phase: start_service  (STATE-CHANGING, new VM, after data_attach)
# Enables and starts the units, waits until the port answers. Idempotent.
# Contract: docs/automation-contract.md section 3.5. Writes ovlm.result/1 to ovlm_result_path.
- name: "OVLM phase start_service"
  hosts: ovlm_target
  become: true
  gather_facts: false
  vars:
    ovlm_phase: start_service
    ovlm_default_class: retryable
  tasks:
    - name: "Run the start_service phase"
      block:
        - name: Start the service (STATE-CHANGING)
          ansible.builtin.include_role:
            name: counter_app
            tasks_from: service_start
        - name: Record the result
          ansible.builtin.set_fact:
            ovlm_changed: "{{ (counter_tm_start is defined and counter_tm_start is changed) or (counter_start_sd is defined and counter_start_sd is changed) }}"
            ovlm_facts: {units: "{{ ovlm_service_units }}", port: "{{ ovlm_app_port }}"}
            ovlm_checks:
              - {name: listening, ok: true, detail: "port {{ ovlm_app_port }} accepts connections", observed: open, expected: open}
            ovlm_message: "service started"
      rescue:
        - name: Remember the failure
          ansible.builtin.set_fact:
            ovlm_failed: true
            ovlm_message: "{{ (ansible_failed_task.name | default('task')) ~ ': ' ~ (ansible_failed_result.msg | default('failed')) }}"
      always:
        - name: Write the ovlm.result/1 document
          ansible.builtin.include_role:
            name: ovlm_result
            tasks_from: write

    - name: Fail the play when the phase failed (exit code 2)
      ansible.builtin.fail:
        msg: "{{ ovlm_message }}"
      when: ovlm_failed | default(false) | bool
