---
# OVLM phase: quiesce  (STATE-CHANGING, OLD VM, starts the downtime)
# Stops units (never disables), unmounts, never edits fstab, never forces.
# Contract: docs/automation-contract.md section 3.4. Writes ovlm.result/1 to ovlm_result_path.
# Failure handling: any failure is caught, classified, written to the result file, then re-raised
# (ansible-playbook exit 2). Planned failures set ovlm_class; unplanned ones get the phase default.
- name: "OVLM phase quiesce"
  hosts: ovlm_target        # the only pattern the contract allows
  become: true
  gather_facts: false
  vars:
    ovlm_phase: quiesce
    ovlm_default_class: needs_human
  tasks:
    - name: "Run the quiesce phase"
      block:
        - name: "Role quiesce"
          ansible.builtin.include_role:
            name: quiesce
      rescue:
        - name: Remember the failure
          ansible.builtin.set_fact:
            ovlm_failed: true
            ovlm_message: "{{ (ansible_failed_task.name | default('task')) ~ ': ' ~ (ansible_failed_result.msg | default('failed')) }}"
      always:
        - name: Write the ovlm.result/1 document
          ansible.builtin.include_role:
            name: ovlm_result
            tasks_from: write

    - name: Fail the play when the phase failed (exit code 2)
      ansible.builtin.fail:
        msg: "{{ ovlm_message }}"
      when: ovlm_failed | default(false) | bool
