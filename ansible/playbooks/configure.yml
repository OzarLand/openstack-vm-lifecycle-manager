---
# OVLM phase: configure  (STATE-CHANGING, new VM, before the volume is attached)
# Idempotent: a second run reports changed=0. Never enables or starts the service.
# Contract: docs/automation-contract.md section 3.2. Writes ovlm.result/1 to ovlm_result_path.
# Failure handling: any failure is caught, classified, written to the result file, then re-raised
# (ansible-playbook exit 2). Planned failures set ovlm_class; unplanned ones get the phase default.
- name: "OVLM phase configure"
  hosts: ovlm_target        # the only pattern the contract allows
  become: true
  gather_facts: false
  vars:
    ovlm_phase: configure
    ovlm_default_class: retryable
  tasks:
    - name: "Run the configure phase"
      block:
        - name: "Role base"
          ansible.builtin.include_role:
            name: base
        - name: "Role counter_app"
          ansible.builtin.include_role:
            name: counter_app
      rescue:
        - name: Remember the failure
          ansible.builtin.set_fact:
            ovlm_failed: true
            ovlm_message: "{{ (ansible_failed_task.name | default('task')) ~ ': ' ~ (ansible_failed_result.msg | default('failed')) }}"
      always:
        - name: Write the ovlm.result/1 document
          ansible.builtin.include_role:
            name: ovlm_result
            tasks_from: write

    - name: Fail the play when the phase failed (exit code 2)
      ansible.builtin.fail:
        msg: "{{ ovlm_message }}"
      when: ovlm_failed | default(false) | bool
