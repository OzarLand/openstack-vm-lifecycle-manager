---
# Writes the ovlm.result/1 document (automation-contract.md 3.7) on the CONTROLLER.
# This is an OVLM artifact, not target state: changed_when is false so a rerun still
# reports changed=0 in the play recap, and check_mode is off so it is written even in --check.
# The playbook sets: ovlm_phase, ovlm_default_class and, as it goes, ovlm_facts, ovlm_checks,
# ovlm_changed, ovlm_class (planned failure class), ovlm_failed, ovlm_message.
- name: Ensure the artifacts directory exists (controller artifact)
  ansible.builtin.file:
    path: "{{ ovlm_result_path | dirname }}"
    state: directory
    # Group-shared: the OVLM worker reads the result as another user of the run's group (lab bug K).
    mode: "0770"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false

- name: Write ovlm.result/1 (controller artifact)
  ansible.builtin.copy:
    dest: "{{ ovlm_result_path }}"
    mode: "0640"
    content: "{{ ovlm_result_doc | to_nice_json }}\n"
  vars:
    _failed: "{{ ovlm_failed | default(false) | bool }}"
    _planned: "{{ ovlm_class is defined }}"
    ovlm_result_doc:
      schema: ovlm.result/1
      phase: "{{ ovlm_phase }}"
      ok: "{{ not _failed }}"
      changed: "{{ ovlm_changed | default(false) | bool }}"
      classification: "{{ 'ok' if not _failed else (ovlm_class | default(ovlm_default_class)) }}"
      facts: "{{ (ovlm_facts | default({})) | combine({'test_mode': ovlm_test_mode | bool}) | combine({'error_kind': ('planned' if _planned else 'automation_error')} if _failed else {}) }}"
      checks: "{{ ovlm_checks | default([]) }}"
      message: "{{ (ovlm_message | default('ok')) | string | truncate(300, True, '...') }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
