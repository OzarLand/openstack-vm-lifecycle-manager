name: ci

# Stages follow docs/testing-strategy.md section 9.2 (static, unit, integration, build/smoke).
# Supply-chain scanning (pip-audit, bandit, image scan) is a separate backlog item.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  static:
    name: lint, types, import boundaries, lock files
    runs-on: ubuntu-latest
    steps:
      # The organization requires actions pinned to a full commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: make lock-check
      - run: make install
      - run: make lint

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: make install
      # promtool for tests/unit/test_alert_rules.py (promtool check/test rules on deploy/prometheus/), checksum pinned
      - name: promtool
        env:
          PROM_VERSION: "2.53.2"
          PROM_SHA256: "60c126740c9cf1206b1e72150dd17914f1c3309bb7dc78a31d4670197ed4fa69"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/prom.tgz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  $RUNNER_TEMP/prom.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/prom.tgz" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          echo "OVLM_PROMTOOL=$RUNNER_TEMP/promtool" >> "$GITHUB_ENV"
      - run: make test-unit

  integration:
    name: integration tests (PostgreSQL)
    # Pinned: the PostgreSQL client step below relies on the noble archive (or the image's preinstalled
    # postgresql-16) carrying the client of the service's major version.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      OVLM_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway-not-a-secret@127.0.0.1:5432/postgres
      # tests/integration/test_backup_restore.py runs pg_dump/pg_restore/psql against the service: they must have
      # its major version (the pg_dump on the runner's PATH can be newer and writes settings 16 refuses). Change
      # together with the service image.
      OVLM_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: make install
      # The runner image normally ships /usr/lib/postgresql/16/bin; otherwise the client comes from the Ubuntu
      # archive (noble's PostgreSQL is 16; signed by the image's own apt keys, no extra repository or key).
      - name: PostgreSQL 16 client tools
        run: |
          if [ ! -x "$OVLM_TEST_PG_BIN/pg_dump" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends postgresql-client-16
          fi
          for t in pg_dump pg_restore psql; do "$OVLM_TEST_PG_BIN/$t" --version | grep -E '\(PostgreSQL\) 16\.'; done
      - run: make test-integration

  ansible:
    name: ansible lint, syntax and reference workload run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"  # ansible-core 2.22 requires Python >= 3.13
      # Exact versions: the lint rules and the ansible-core behaviour under test must not move by themselves.
      - run: python -m pip install "ansible-core==2.22.0" "ansible-lint==26.10.1" "yamllint==1.38.0"
      # Lint, syntax check, static contract lints, decision table, then the run against a local container.
      - run: ansible/tests/run.sh

  compose-smoke:
    name: image build and Compose smoke test
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make up
      - run: make smoke
      - name: smoke again on the same containers (it must be repeatable)
        run: make smoke
      - name: Compose logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: make down
