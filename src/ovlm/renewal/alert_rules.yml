# Sample Prometheus alert rules for the renewal strategy (architecture.md section 6, SRE-R-9 e).
# Paging is mandatory: route at least OvlmPostStartFailure and OvlmNeedsHumanInWindow to an on-call pager.
groups:
  - name: ovlm-renewal
    rules:
      - alert: OvlmPostStartFailure
        expr: sum(ovlm_runs_needing_attention{reason="post_start_failure"}) > 0
        labels: {severity: page}
        annotations:
          summary: "A renewal failed after the service started on green (no snapshot): the service is down until a human acts (D-1 = B)."
      - alert: OvlmNeedsHumanInWindow
        expr: sum(ovlm_runs_needing_attention{phase="window"}) > 0
        labels: {severity: page}
        annotations:
          summary: "A renewal is in needs_human inside the downtime window."
      - alert: OvlmApprovalEvidenceInvalid
        expr: increase(ovlm_approval_evidence_invalid_total[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Approval evidence re-validation failed (possible forged approval, SRE-R-23)."
      - alert: OvlmWindowBudgetExceeded
        expr: increase(ovlm_window_budget_exceeded_total[10m]) > 0
        labels: {severity: page}
      - alert: OvlmAutoRestore
        expr: increase(ovlm_auto_restore_total[10m]) > 0
        labels: {severity: ticket}
      - alert: OvlmRunNeedsHumanLong
        expr: sum(ovlm_runs_needing_attention) > 0
        for: 15m
        labels: {severity: ticket}
