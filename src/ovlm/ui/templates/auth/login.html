{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p><label>Username <input name="username" required autocomplete="username" maxlength="64"></label></p>
  <p><label>Password <input name="password" type="password" required autocomplete="current-password"></label></p>
  <p><label>Authenticator code <input name="totp_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
     <span class="muted">(if you enrolled TOTP; required for approvers and admins)</span></p>
  <p><button type="submit">Log in</button></p>
</form>
{% endblock %}
