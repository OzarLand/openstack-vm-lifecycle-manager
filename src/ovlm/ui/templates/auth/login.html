{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  {% if error %}<p role="alert" class="banner error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label for="username">Username</label>
       <input id="username" name="username" required autocomplete="username" maxlength="64" autofocus></p>
    <p><label for="password">Password</label>
       <input id="password" name="password" type="password" required autocomplete="current-password"></p>
    <p><label for="totp_code">Authenticator code</label>
       <input id="totp_code" name="totp_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-describedby="totp-help">
       <span id="totp-help" class="hint">Needed if you enrolled TOTP; required for approvers and admins.</span></p>
    <p><button type="submit" class="primary">Log in</button></p>
  </form>
</div>
{% endblock %}
