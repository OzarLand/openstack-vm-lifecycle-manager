# Sample nginx TLS proxy for OVLM (docs/install-guide-real-cloud.md section 2.3). OVLM does not terminate TLS.
# Not tested by the project: adapt, then `nginx -t`. Replace ovlm.example.org and the certificate paths.
# The api (compose.prod.yaml) listens on 127.0.0.1:8000 on this host.

server {
    listen 80;
    listen [::]:80;
    server_name ovlm.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ovlm.example.org;

    # An RSA or ECDSA certificate. Never Ed25519: browsers refused it (lab bug R).
    ssl_certificate     /etc/ssl/ovlm/fullchain.pem;
    ssl_certificate_key /etc/ssl/ovlm/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS is the proxy's job (security-model.md section 9).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Do NOT add a Referrer-Policy header here: `no-referrer` made browsers send `Origin: null` and OVLM's CSRF check
    # refused every form (lab bug N). OVLM sends `Referrer-Policy: same-origin` itself.

    # The api answers 404 for /metrics on this port anyway; Prometheus scrapes :9100 on the Compose network.
    location = /metrics { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append to, what the client sent: OVLM trusts this header only from http.trusted_proxies
        # and records it in the audit trail. Origin and Referer pass through unchanged (nginx's default).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
    }
}
