# Alembic configuration for the `alembic` CLI (development). The `ovlm migrate` command builds its own
# Config (src/ovlm/db/schema.py) and takes the connection from the settings; no URL or password lives here.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
# Set OVLM_PROCESS_ROLE=migrate and OVLM_DB__PASSWORD_FILE when using the `alembic` CLI directly.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
