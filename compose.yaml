# Development/CI Compose file. Secrets are files under ./secrets (see `make secrets`); never env values.
# A real installation uses compose.prod.yaml instead (docs/install-guide-real-cloud.md section 5.4).
name: ovlm

x-ovlm: &ovlm
  image: ovlm:dev
  build: .
  environment: &ovlm-env
    OVLM_CONFIG_FILE: /nonexistent   # no TOML file in the dev stack; settings below come from env
    OVLM_DB__HOST: postgres
    OVLM_DB__NAME: ovlm
    OVLM_DB__SSLMODE: disable        # private Compose network; enable TLS if the DB is remote
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_superuser_password, db_owner_password, db_api_password, db_worker_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/10-ovlm-roles.sh:/docker-entrypoint-initdb.d/10-ovlm-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ovlm"]
      interval: 3s
      timeout: 3s
      retries: 30
    # not published outside the Compose network

  migrate:
    <<: *ovlm
    command: ["migrate"]
    environment:
      <<: *ovlm-env
      OVLM_DB__PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]   # only the migrate service sees the owner secret (SEC-R-18)
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *ovlm
    command: ["api"]
    environment:
      <<: *ovlm-env
      OVLM_DB__PASSWORD_FILE: /run/secrets/db_api_password
      OVLM_HTTP__HOST: 0.0.0.0        # container-internal; published on loopback only below
      OVLM_HTTP__METRICS_HOST: 0.0.0.0 # reachable on the Compose network only, never published
      # Development stack: no TLS proxy and no external_url. A real installation sets OVLM_EXTERNAL_URL and
      # OVLM_HTTP__TRUSTED_PROXIES (the proxy's address) instead, and never development mode.
      OVLM_DEVELOPMENT_MODE: "true"
      OVLM_KEK__PUBLIC_KEY_FILE: /run/secrets/worker_kek_pub   # seal only: the api never holds the private key
      OVLM_AUTH__TOTP_KEY_FILE: /run/secrets/totp_key   # encrypts TOTP secrets at rest; api only (dev key: make secrets)
    secrets: [db_api_password, worker_kek_pub, totp_key]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *ovlm
    image: ovlm-worker:dev              # ansible, ansible-runner and the pinned collections live only in this image
    build:
      context: .
      target: worker
      # Builds behind an HTTPS-only egress proxy: set HTTPS_PROXY (and NO_PROXY) in .env, see docs/install-guide.md 5a.
      # Empty (the default) means no proxy. apt in the worker stage uses https:// sources (Dockerfile APT_URI_SCHEME).
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1}
    command: ["worker"]
    # No `init: true` (review CS-6, SF-1): docker-init would stay PID 1 as root with every capability below for the
    # container's life. The entrypoint runs tini as PID 1 only after dropping to uid ovlm (worker-entrypoint.sh).
    # Starts as container root with five capabilities; the entrypoint drops to uid ovlm and keeps only
    # CAP_SETUID/SETGID/KILL (ambient) so the worker can run ansible-runner as `ovlm-ansible` and stop its tree.
    # SETPCAP is needed once, by the launcher, to trim the bounding set. Nothing runs as root afterwards
    # (`make smoke` checks it). (automation-contract.md section 11.) no-new-privileges stays on: no setuid binary.
    # DAC_READ_SEARCH lets the launcher (root) read the 0400 KEK file once to copy it, as uid ovlm, into the worker's
    # private tmpfs; the launcher then drops it from every set before the worker starts (worker-entrypoint.sh).
    # `docker compose exec` and the healthcheck start as the container user (root, with these capabilities): enter
    # with `docker compose exec -u ovlm worker ...`; the healthcheck drops to ovlm before running anything.
    user: "0:0"
    cap_add: [SETUID, SETGID, SETPCAP, KILL, DAC_READ_SEARCH]
    environment:
      <<: *ovlm-env
      OVLM_DB__PASSWORD_FILE: /run/secrets/db_worker_password
      OVLM_HTTP__METRICS_HOST: 0.0.0.0
      OVLM_AUTOMATION__RUN_ROOT: /run/ovlm
      OVLM_AUTOMATION__REQUIRE_TMPFS: "true"
      OVLM_AUTOMATION__RUN_USER: ovlm-ansible
      # Persistent copy of each run's verified checkout (digest-checked against B6's evidence on re-adoption): a
      # container restart inside the downtime window empties the /run/ovlm tmpfs but not this volume (lab finding Z).
      OVLM_AUTOMATION__CHECKOUT_CACHE: /var/lib/ovlm/checkouts
      OVLM_KEK__PRIVATE_KEY_FILE: /run/ovlm-kek/worker_kek   # the launcher's 0600 copy, readable by uid ovlm only
      # Egress proxy for the OpenStack APIs (openstacksdk/keystoneauth honour these; docs/install-guide.md 5a).
      # NO_PROXY must list the project subnet(s) and guest addresses: SSH never uses an HTTP proxy, and OVLM's own
      # guest health probe ignores proxy variables altogether, so guests are always reached directly. Empty = no proxy.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1}
    secrets: [db_worker_password, worker_kek]   # the KEK private key: worker only (security-model.md 5.1)
    tmpfs:
      - /run/ovlm:mode=0710,uid=10001,gid=10002   # automation.run_root: memory only; group ovlm-ansible may traverse
      - /run/ovlm-kek:mode=0700,uid=10001,gid=10001   # the KEK copy: uid ovlm only (not ovlm-ansible)
    volumes:
      # automation.checkout_cache: 0700 ovlm:ovlm (the image's empty directory seeds a new volume with that owner and
      # mode); ovlm-ansible cannot list it. Holds no secret: verified, read-only checkouts only.
      - checkouts:/var/lib/ovlm/checkouts
    stop_grace_period: 40s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "setpriv", "--reuid=10001", "--regid=10001", "--clear-groups", "--inh-caps=-all", "--bounding-set=-all", "--no-new-privs", "--", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  db_superuser_password: {file: ./secrets/db_superuser_password}
  db_owner_password: {file: ./secrets/db_owner_password}
  db_api_password: {file: ./secrets/db_api_password}
  db_worker_password: {file: ./secrets/db_worker_password}
  worker_kek: {file: ./secrets/worker_kek}           # 0400 on the host: unreadable to ovlm-ansible in the container
  worker_kek_pub: {file: ./secrets/worker_kek.pub}
  totp_key: {file: ./secrets/totp_key}               # dev-only Fernet key (make secrets); api only

volumes:
  pgdata:
  checkouts:   # worker only: automation.checkout_cache
