# Development/CI Compose file. Secrets are files under ./secrets (see `make secrets`); never env values.
name: ovlm

x-ovlm: &ovlm
  image: ovlm:dev
  build: .
  environment: &ovlm-env
    OVLM_CONFIG_FILE: /nonexistent   # no TOML file in the dev stack; settings below come from env
    OVLM_DB__HOST: postgres
    OVLM_DB__NAME: ovlm
    OVLM_DB__SSLMODE: disable        # private Compose network; enable TLS if the DB is remote
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_superuser_password, db_owner_password, db_api_password, db_worker_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/10-ovlm-roles.sh:/docker-entrypoint-initdb.d/10-ovlm-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ovlm"]
      interval: 3s
      timeout: 3s
      retries: 30
    # not published outside the Compose network

  migrate:
    <<: *ovlm
    command: ["migrate"]
    environment:
      <<: *ovlm-env
      OVLM_DB__PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]   # only the migrate service sees the owner secret (SEC-R-18)
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *ovlm
    command: ["api"]
    environment:
      <<: *ovlm-env
      OVLM_DB__PASSWORD_FILE: /run/secrets/db_api_password
      OVLM_HTTP__HOST: 0.0.0.0        # container-internal; published on loopback only below
      OVLM_HTTP__METRICS_HOST: 0.0.0.0 # reachable on the Compose network only, never published
      # Development stack: no TLS proxy and no external_url. A real installation sets OVLM_EXTERNAL_URL and
      # OVLM_HTTP__TRUSTED_PROXIES (the proxy's address) instead, and never development mode.
      OVLM_DEVELOPMENT_MODE: "true"
      OVLM_KEK__PUBLIC_KEY_FILE: /run/secrets/worker_kek_pub   # seal only: the api never holds the private key
    secrets: [db_api_password, worker_kek_pub]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *ovlm
    image: ovlm-worker:dev              # ansible, ansible-runner and the pinned collections live only in this image
    build:
      context: .
      target: worker
    command: ["worker"]
    init: true                          # minimal init: signal forwarding and reaping
    # Starts as container root with four capabilities; the entrypoint drops to uid ovlm and keeps only
    # CAP_SETUID/SETGID/KILL (ambient) so the worker can run ansible-runner as `ovlm-ansible` and stop its tree.
    # SETPCAP is needed once, by the launcher, to trim the bounding set. Nothing runs as root afterwards.
    # (automation-contract.md section 11.) no-new-privileges stays on: no setuid binary, no sudo.
    # DAC_READ_SEARCH lets the launcher (root) read the 0400 KEK file once to copy it, as uid ovlm, into the worker's
    # private tmpfs; the launcher then drops it from every set before the worker starts (worker-entrypoint.sh).
    user: "0:0"
    cap_add: [SETUID, SETGID, SETPCAP, KILL, DAC_READ_SEARCH]
    environment:
      <<: *ovlm-env
      OVLM_DB__PASSWORD_FILE: /run/secrets/db_worker_password
      OVLM_HTTP__METRICS_HOST: 0.0.0.0
      OVLM_AUTOMATION__RUN_ROOT: /run/ovlm
      OVLM_AUTOMATION__REQUIRE_TMPFS: "true"
      OVLM_AUTOMATION__RUN_USER: ovlm-ansible
      OVLM_KEK__PRIVATE_KEY_FILE: /run/ovlm-kek/worker_kek   # the launcher's 0600 copy, readable by uid ovlm only
    secrets: [db_worker_password, worker_kek]   # the KEK private key: worker only (security-model.md 5.1)
    tmpfs:
      - /run/ovlm:mode=0710,uid=10001,gid=10002   # automation.run_root: memory only; group ovlm-ansible may traverse
      - /run/ovlm-kek:mode=0700,uid=10001,gid=10001   # the KEK copy: uid ovlm only (not ovlm-ansible)
    stop_grace_period: 40s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  db_superuser_password: {file: ./secrets/db_superuser_password}
  db_owner_password: {file: ./secrets/db_owner_password}
  db_api_password: {file: ./secrets/db_api_password}
  db_worker_password: {file: ./secrets/db_worker_password}
  worker_kek: {file: ./secrets/worker_kek}           # 0400 on the host: unreadable to ovlm-ansible in the container
  worker_kek_pub: {file: ./secrets/worker_kek.pub}

volumes:
  pgdata:
